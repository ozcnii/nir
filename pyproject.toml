[project]
name = "real-estate-catalog"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django==5.2.19",
  "playwright==1.65.2",
  "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
  "django-stubs==5.2.9",
  "django-stubs-ext==5.2.9",
  "djlint==1.53.1",
  "mypy==1.19.1",
  "pre-commit==4.7.0",
  "ruff==0.17.5",
]

[tool.uv]
required-version = "==0.13.9"

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
unsafe-fixes = false

[tool.ruff.lint]
preview = false
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PGH004", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["config", "catalog", "collection"]

[tool.ruff.format]
preview = false
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code"]

# T02 enables the Django plugin once its settings module exists.

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
format_js = false
format_css = false
