<div class="room-presets"
     data-room-presets
     role="group"
     aria-label="Количество комнат"
     hidden>
  <span>Комнаты</span>
  <button class="button button-secondary" type="button" data-rooms="">Любое</button>
  <button class="button button-secondary" type="button" data-rooms="0">Студия</button>
  <button class="button button-secondary"
          type="button"
          data-rooms="1"
          aria-label="1 комната">1</button>
  <button class="button button-secondary"
          type="button"
          data-rooms="2"
          aria-label="2 комнаты">2</button>
  <button class="button button-secondary"
          type="button"
          data-rooms="3"
          aria-label="3 комнаты">3</button>
  <button class="button button-secondary"
          type="button"
          data-rooms="4+"
          aria-label="4 комнаты и больше">4+</button>
</div>
