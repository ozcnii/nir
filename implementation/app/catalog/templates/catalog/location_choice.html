<template id="location-choice-template">
  <div class="location-choice" hidden>
    <button class="location-choice-toggle" type="button" aria-expanded="false">
      <span class="control-label">Выбрать</span>
    </button>
    <div class="location-choice-panel panel" hidden>
      <input type="search" autocomplete="off">
      <div class="location-choice-options" role="group"></div>
      <p class="hint" role="status"></p>
    </div>
  </div>
</template>
