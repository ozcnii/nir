{% if ad.photos %}
  <section class="publication-photos">
    <h4 class="sr-only">Фотографии</h4>
    {% include "catalog/gallery.html" with photos=ad.photos show_links=True thumbnails=True only %}
  </section>
{% elif ad.photos_observed_at %}
  <p class="hint">Фото не опубликованы</p>
{% else %}
  <p class="hint">Фото не получены</p>
{% endif %}
