services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    stop_grace_period: 60s
    environment:
      DB_NAME: ${DB_NAME:-catalog}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    ports:
      - host_ip: 127.0.0.1
        target: 8000
        published: "${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    security_opt:
      - seccomp=./docker/playwright-seccomp.json

  db:
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    ports:
      - host_ip: "${DB_PUBLISHED_HOST:-127.0.0.1}"
        target: 5432
        published: "${DB_PUBLISHED_PORT:-5432}"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
